<!doctype html>
<!--
  SC제일은행 SC Mobile home screen, rebuilt in React as the workshop base.
  SC Mobile 홈 화면을 React로 다시 만든 워크숍 기본 화면입니다.

  Measured 1:1 off five iPhone screenshots (393 x 852 pt, screens/01.png to 05.png).
  Photos, illustrations and colour icons are crops from those screenshots, in assets/.
  Everything else (type, cards, borders, line icons) is code, so it can be rearranged.

  Korean is the app as shipped. English is a translation for the international audience.
  Switch with the 한국어 / English control at the top left, or open index.html?lang=en.
  한국어는 실제 앱 그대로, 영어는 번역입니다. 왼쪽 위 버튼이나 ?lang=en 으로 바꿉니다.

  Content lives in `copy` at the top of the script, one set per language with the same shape.
  Open this file by double-clicking it. No install, no build: React and Babel are in vendor/.
-->

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  );
}

function QuickLinks({ t }) {
  return (
    <nav className="quick">
      {t.quick.map((label, index) => (
        <button className="quick-item" key={label}>
          <img src={art.quick[index]} width="54" height="54" alt="" />
          <span>{label}</span>
        </button>
      ))}
    </nav>
  );
}

function AccountsCard({ t }) {
  return (
    <section className="accounts" aria-label={t.accountsTitle}>
      <div className="accounts-fin" aria-hidden="true" />
      <div className="accounts-card">
        <div className="accounts-head">
          {t.accountsTitle}
          <button className="icon-button" style={{ width: 28, height: 28, color: "var(--brand-blue)" }} aria-label={t.hideBalances}>{icons.eyeOff}</button>
        </div>
        {t.accounts.map((rows, index) => (
          <div className="accounts-group" key={index}>
            {rows.map(([label, value]) => (
              <button className="account-row" key={label}>
                {label}
                <span className="account-value">{value}</span>
                <span className="chevron">{icons.chevron}</span>
              </button>
            ))}
          </div>
        ))}
      </div>
    </section>
  );
}

function ProductShortcuts({ t }) {
  return (
    <nav className="products">
      {t.products.map((label, index) => (
        <button className="product" key={label}>
          <img src={art.products[index]} width="54" height="54" alt="" />
          <span>{label}</span>
        </button>
      ))}
    </nav>
  );
}

function FeedCard({ tone, eyebrow, title, period, image }) {
  return (
    <button className={`feed-card is-${tone}`}>
      <div className="feed-text">
        <p className="feed-eyebrow">{eyebrow}</p>
        <p className="feed-title"><Lines lines={title} /></p>
        {period && <p className="feed-period">{period}</p>}
      </div>
      {image.thumb
        ? <img className="feed-thumb" src={image.src} alt="" />
        : <img className="feed-art" src={image.src} width={image.width} height={image.height} alt="" />}
    </button>
  );
}

function BottomNav({ t }) {
  return (
    <nav className="nav">
      <img className="nav-home" src="assets/nav-home.png" width="78" height="70" alt="" />
      {t.tabs.map((tab, index) => (
        <button className="nav-item" key={tab} style={{ left: tabCentres[index] }} aria-current={index === 0 ? "page" : undefined}>
          {icons.tabs[index]}
          <span>{tab}</span>
        </button>
      ))}
    </nav>
  );
}

function LanguageSwitch({ lang, onChange }) {
  return (
    <div className="lang" role="group" aria-label="Language / 언어">
      <button aria-pressed={lang === "ko"} onClick={() => onChange("ko")}>한국어</button>
      <button aria-pressed={lang === "en"} onClick={() => onChange("en")}>English</button>
    </div>
  );
}

function App() {
  const [lang, setLang] = useState(() => (new URLSearchParams(location.search).get("lang") === "en" ? "en" : "ko"));
  const [scrolled, setScrolled] = useState(false);
  const t = copy[lang];

  useEffect(() => {
    document.documentElement.lang = lang;
  }, [lang]);

  useEffect(() => {
    const onScroll = () => setScrolled(window.scrollY > 4);
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => window.removeEventListener("scroll", onScroll);
  }, []);

  return (
    <>
      <LanguageSwitch lang={lang} onChange={setLang} />
      <div className="app">
        <TopBar t={t} scrolled={scrolled} />
        <main>
          <BannerCarousel t={t} />
          <QuickLinks t={t} />
          <AccountsCard t={t} />
          <ProductShortcuts t={t} />
          <section className="feed">
            {t.feed.map((card, index) => <FeedCard key={index} {...card} image={art.feed[index]} />)}
          </section>
        </main>
        <BottomNav t={t} />
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
