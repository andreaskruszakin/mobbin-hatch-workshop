<!doctype html>
<!--
  SC제일은행 SC Mobile home screen, rebuilt as one plain HTML file for the workshop.
  SC Mobile 홈 화면을 HTML 파일 하나로 다시 만든 워크숍 기본 화면입니다.

  Measured 1:1 off five iPhone screenshots (393 x 852 pt, screens/01.png to 05.png). 1 CSS px = 1 pt.
  Photos, illustrations and colour icons are crops from those screenshots, in assets/.
  Everything else (type, cards, borders, line icons) is HTML and CSS, so it can be rearranged.

  Korean is the app as shipped. English is a translation for the international audience.
  Every piece of text is written twice, side by side: <span lang="ko">홈</span><span lang="en">Home</span>.
  The page shows the language set on <html lang="...">; CSS hides the other one.
  Switch with the 한국어 / English control at the top left, or open index.html?lang=en.
  모든 글자는 두 번 씁니다: lang="ko" 한 번, lang="en" 한 번. 왼쪽 위 버튼이나 ?lang=en 으로 바꿉니다.

  Open this file by double-clicking it. No install, no build. 설치도 빌드도 필요 없습니다.
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SC제일은행 SC Mobile 홈 / Home</title>
<style>
  :root {
    --ink: #111;
    --ink-muted: #8f8f8f;
    --brand-blue: #2f6db5;
    --sc-navy: #071b2e;
    --sc-green: #1ac101;
    --sc-blue: #4a7dfa;
    --lime: #aef457;
    --card-border: #ebebeb;
    --divider: #d9eed8;
    --tint-cyan: #ddf7f9;
    --tint-yellow: #fff2d5;
    --eyebrow-orange: #ee9b00;
    --eyebrow-blue: #4781c1;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: #f2f2f2; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; text-align: inherit; }
  img { display: block; }

  /* Two languages: show the one on <html lang>, hide the other. 언어 전환. */
  html[lang="ko"] [lang="en"], html[lang="en"] [lang="ko"] { display: none; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* Workshop control, not part of the app: sits outside the phone column. */
  .lang { position: fixed; top: 16px; left: 16px; z-index: 20; display: flex; padding: 3px; border-radius: 10px; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .15); font-size: 13px; }
  .lang button { padding: 6px 10px; border-radius: 7px; color: #555; }
  .lang button[aria-pressed="true"] { background: #191919; color: #fff; }
  @media (max-width: 560px) { .lang { position: static; width: fit-content; margin: 8px auto; } }

  .app { position: relative; width: 393px; min-height: 852px; margin: 0 auto; background: #fff; }

  /* Fixed top: status bar plus toolbar. Gains a shadow once the page scrolls. */
  .top { position: sticky; top: 0; z-index: 10; background: #fff; height: 102px; transition: box-shadow .2s ease-out; }
  .top.is-scrolled { box-shadow: 0 2px 6px rgba(0, 0, 0, .08); }
  .status { height: 42px; display: flex; align-items: center; justify-content: space-between; padding: 12px 30px 0 46px; }
  .status-time { display: flex; align-items: center; gap: 4px; font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .status-icons { display: flex; align-items: center; gap: 6px; }
  .toolbar { height: 58px; display: flex; align-items: center; padding: 0 15px; }
  .easy { display: flex; align-items: center; gap: 6px; font-size: 15px; white-space: nowrap; }
  .switch { width: 48px; height: 28px; border-radius: 14px; background: #d6d6d6; position: relative; }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, .2); transition: transform .2s ease-out; }
  .switch[aria-checked="true"] { background: var(--sc-green); }
  .switch[aria-checked="true"]::after { transform: translateX(20px); }
  .toolbar-actions { margin-left: auto; display: flex; align-items: center; }
  .icon-button { width: 39px; height: 39px; display: grid; place-items: center; }
  .logout { margin: -2px -15px 0 8px; width: 86px; height: 27px; padding-right: 6px; border-radius: 14px 4px 14px 4px; background: #191919; color: #fff; font-size: 12px; font-weight: 600; text-align: center; white-space: nowrap; }

  /* Hero banner carousel. The next slide peeks in from the right. */
  .banners { display: flex; gap: 15px; padding: 10px 15px 0; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
  .banners::-webkit-scrollbar { display: none; }
  .banner { position: relative; flex: 0 0 346px; height: 199px; border-radius: 10px; overflow: hidden; scroll-snap-align: start; background: var(--sc-navy); color: #fff; }
  .banner > img { position: absolute; inset: 0; width: 100%; height: 100%; }
  .banner-copy { position: relative; padding: 19px 0 0 21px; }
  .banner-title { font-size: 20px; font-weight: 600; line-height: 30px; }
  .banner-sub { margin-top: 10px; font-size: 14.5px; line-height: 20px; }
  .banner-cta { margin-top: 14px; min-width: 75px; text-align: center; height: 30px; padding: 0 14px; border-radius: 15px; font-size: 14px; color: #fff; background: linear-gradient(#000, #000) padding-box, linear-gradient(90deg, #1c78f0, #2ab06a) border-box; border: 1.5px solid transparent; }
  .banner.is-peek { background: #1b2f45; }
  .banner.is-peek::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: linear-gradient(#1c78f0, #2bd13b); }

  .quick { display: flex; justify-content: space-between; padding: 14px 0 0; width: 234px; margin: 0 0 0 77px; }
  .quick-item { width: 54px; display: flex; flex-direction: column; align-items: center; }
  .quick-label { margin-top: 7px; font-size: 13px; color: var(--brand-blue); white-space: nowrap; }

  /* 전체계좌: every account type in one card, with the decorative gradient fin behind its right edge. */
  .accounts { position: relative; margin: 19px 13px 0 13px; padding: 5px 2px 2px 4px; border: 1px solid #a3edf5; border-radius: 14px; }
  .accounts-fin { position: absolute; right: -13px; top: 70px; width: 56px; height: 400px; border-radius: 60px 0 0 60px; background: linear-gradient(180deg, #4b8ef2 0%, #18b8fd 38%, #2ccfdb 68%, #77ef8a 100%); -webkit-mask-image: linear-gradient(90deg, transparent, #000 75%); mask-image: linear-gradient(90deg, transparent, #000 75%); transform: skewY(-12deg); }
  .accounts-card { position: relative; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
  .accounts-head { height: 36px; display: flex; align-items: center; justify-content: space-between; padding: 0 14px 0 13px; background: #f7f7f7; font-size: 15px; }
  .accounts-hide { width: 28px; height: 28px; color: var(--brand-blue); }
  .accounts-group { border-left: 2px solid var(--sc-green); }
  .accounts-group + .accounts-group { border-left-color: var(--sc-blue); }
  .account-row { width: 100%; height: 68px; display: flex; align-items: center; padding: 0 14px 0 16px; border-top: 1px solid var(--divider); background: linear-gradient(90deg, #fff 78%, rgba(255, 255, 255, .72)); font-size: 17px; }
  .account-row:first-child { border-top: 0; }
  .account-value { margin-left: auto; font-size: 20px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .chevron { margin-left: 10px; width: 19px; height: 19px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .18); display: grid; place-items: center; }

  .products { margin: 29px 15px 0; height: 98px; display: grid; grid-template-columns: repeat(5, 1fr); padding: 0 6px; border: 1.5px solid transparent; border-radius: 12px; background: linear-gradient(#fff, #fff) padding-box, linear-gradient(180deg, #6ef3ff, #8af7a0) border-box; box-shadow: 0 3px 4px -2px rgba(120, 240, 120, .5); }
  .product { display: flex; flex-direction: column; align-items: center; padding-top: 9px; font-size: 14px; }
  .product-label { margin-top: -2px; color: #1b1b1b; white-space: nowrap; }
  html[lang="en"] .product-label { max-width: 52px; white-space: normal; text-align: center; font-size: 13px; line-height: 14px; }

  .feed { display: flex; flex-direction: column; gap: 13px; margin: 27px 15px 0; padding-bottom: 145px; }
  .feed-card { position: relative; display: flex; align-items: center; gap: 12px; min-height: 110px; padding: 0 21px; border-radius: 10px; }
  .feed-card.is-cyan { background: var(--tint-cyan); }
  .feed-card.is-yellow { background: var(--tint-yellow); }
  .feed-card.is-event { min-height: 133px; border: 1px solid var(--card-border); background: #fff; }
  .feed-text { flex: 1; }
  .feed-eyebrow { font-size: 14.5px; line-height: 20px; color: var(--eyebrow-blue); font-variant-numeric: tabular-nums; }
  .is-yellow .feed-eyebrow { color: var(--eyebrow-orange); }
  .is-event .feed-eyebrow { color: var(--brand-blue); }
  .feed-title { margin-top: 6px; font-size: 17px; line-height: 24px; font-weight: 500; text-wrap: pretty; }
  .feed-period { margin-top: 6px; font-size: 14.5px; color: var(--ink-muted); font-variant-numeric: tabular-nums; }
  .feed-art { flex-shrink: 0; margin-right: -2px; }
  .feed-thumb { flex-shrink: 0; width: 80px; height: 80px; border-radius: 10px; object-fit: cover; }

  /* Bottom tab bar with the raised SC logo. The arc around the logo is part of nav-home.png.
     Each tab sits on its measured centre (style="left: ..."). */
  .nav { position: sticky; bottom: 0; z-index: 10; height: 105px; margin-top: -105px; background: #fff; border-top: 2px solid var(--lime); }
  .nav-home { position: absolute; left: 23.33px; top: -24px; }
  .nav-item { position: absolute; top: 0; width: 70px; height: 70px; margin-left: -35px; font-size: 14px; text-align: center; }
  .nav-item svg { position: absolute; top: 11px; left: 20px; width: 30px; height: 30px; }
  .nav-label { position: absolute; top: 46px; left: -10px; right: -10px; white-space: nowrap; }

  :focus-visible { outline: 2px solid var(--sc-blue); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<!-- Workshop control, not part of the app. 워크숍용 언어 버튼 (앱에는 없음). -->
<div class="lang" role="group" aria-label="Language / 언어">
  <button data-set-lang="ko" aria-pressed="true">한국어</button>
  <button data-set-lang="en" aria-pressed="false">English</button>
</div>

<div class="app">

  <!-- Top bar: status bar, 편한뱅킹 switch, notifications, search, log out. -->
  <header class="top">
    <div class="status" aria-hidden="true">
      <span class="status-time">9:41
        <svg width="12" height="12" viewBox="0 0 12 12"><circle cx="6" cy="3.5" r="2.6" /><path d="M1 11.5a5 4 0 0 1 10 0Z" /></svg>
      </span>
      <span class="status-icons">
        <svg width="19" height="12" viewBox="0 0 19 12"><rect x="0" y="8" width="3" height="4" rx="1" /><rect x="5" y="5.5" width="3" height="6.5" rx="1" /><rect x="10" y="3" width="3" height="9" rx="1" /><rect x="15" y="0" width="3" height="12" rx="1" /></svg>
        <svg width="17" height="12" viewBox="0 0 17 12"><path d="M8.5 2.2c2.4 0 4.6.9 6.3 2.5l1.3-1.4A11 11 0 0 0 8.5.2 11 11 0 0 0 .9 3.3l1.3 1.4a9 9 0 0 1 6.3-2.5Zm0 3.8c1.4 0 2.6.5 3.6 1.4l1.3-1.4a7 7 0 0 0-9.8 0l1.3 1.4c1-.9 2.2-1.4 3.6-1.4Zm0 3.7L10.4 8a2.8 2.8 0 0 0-3.8 0Z" /></svg>
        <svg width="28" height="13" viewBox="0 0 28 13"><rect x="0.5" y="0.5" width="24" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".4" /><rect x="2" y="2" width="21" height="9" rx="2" /><rect x="25.5" y="4" width="2" height="5" rx="1" opacity=".4" /></svg>
      </span>
    </div>
    <div class="toolbar">
      <div class="easy">
        <span id="easy-label"><span lang="ko">편한뱅킹</span><span lang="en">Easy mode</span></span>
        <button class="switch" role="switch" aria-checked="false" aria-labelledby="easy-label"></button>
      </div>
      <div class="toolbar-actions">
        <button class="icon-button">
          <span class="sr-only"><span lang="ko">알림</span><span lang="en">Notifications</span></span>
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 17V11a6 6 0 0 1 12 0v6l1.5 1.5h-15L6 17Z" /><path d="M10 21h4" /></svg>
        </button>
        <button class="icon-button">
          <span class="sr-only"><span lang="ko">검색</span><span lang="en">Search</span></span>
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7.5" /><path d="m21 21-4.5-4.5" /></svg>
        </button>
        <button class="logout"><span lang="ko">로그아웃</span><span lang="en">Log out</span></button>
      </div>
    </div>
  </header>

  <main>

    <!-- Banner carousel: the LFC ad, with the next slide peeking in. -->
    <section class="banners">
      <article class="banner">
        <img src="assets/banner-lfc.jpg" alt="">
        <div class="banner-copy">
          <h2 class="banner-title"><span lang="ko">리버풀FC 코치진과<br>축구 레슨을!</span><span lang="en">Football lessons<br>with LFC coaches!</span></h2>
          <p class="banner-sub"><span lang="ko">리버풀FC<br>싸커스쿨 이벤트</span><span lang="en">Liverpool FC<br>Soccer School event</span></p>
          <button class="banner-cta"><span lang="ko">바로가기</span><span lang="en">Go</span></button>
        </div>
      </article>
      <div class="banner is-peek" aria-hidden="true"></div>
    </section>

    <!-- Quick links under the banner. -->
    <nav class="quick">
      <button class="quick-item">
        <img src="assets/quick-benefit.png" width="54" height="54" alt="">
        <span class="quick-label"><span lang="ko">혜택</span><span lang="en">Benefits</span></span>
      </button>
      <button class="quick-item">
        <img src="assets/quick-mydata.png" width="54" height="54" alt="">
        <span class="quick-label"><span lang="ko">마이데이터</span><span lang="en">MyData</span></span>
      </button>
      <button class="quick-item">
        <img src="assets/quick-market.png" width="54" height="54" alt="">
        <span class="quick-label"><span lang="ko">글로벌시황</span><span lang="en">Markets</span></span>
      </button>
    </nav>

    <!-- 전체계좌 / All accounts. Two groups, as in the app: a green rule marks the first five rows, a blue rule the last three. -->
    <section class="accounts" aria-labelledby="accounts-title">
      <div class="accounts-fin" aria-hidden="true"></div>
      <div class="accounts-card">
        <div class="accounts-head">
          <span id="accounts-title"><span lang="ko">전체계좌</span><span lang="en">All accounts</span></span>
          <button class="icon-button accounts-hide">
            <span class="sr-only"><span lang="ko">금액 숨기기</span><span lang="en">Hide balances</span></span>
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6S2 12 2 12Z" /><circle cx="12" cy="12" r="3" /><path d="M4 20 20 4" /></svg>
          </button>
        </div>
        <div class="accounts-group">
          <button class="account-row"><span lang="ko">입출금</span><span lang="en">Checking</span>
            <span class="account-value"><span lang="ko">99,749원</span><span lang="en">₩99,749</span></span>
            <span class="chevron"><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m2.5 3.8 2.5 2.5 2.5-2.5" /></svg></span>
          </button>
          <button class="account-row"><span lang="ko">다른은행</span><span lang="en">Other banks</span>
            <span class="account-value"><span lang="ko">0개</span><span lang="en">0 linked</span></span>
            <span class="chevron"><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m2.5 3.8 2.5 2.5 2.5-2.5" /></svg></span>
          </button>
          <button class="account-row"><span lang="ko">예적금</span><span lang="en">Deposits &amp; savings</span>
            <span class="account-value"><span lang="ko">0원</span><span lang="en">₩0</span></span>
            <span class="chevron"><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m2.5 3.8 2.5 2.5 2.5-2.5" /></svg></span>
          </button>
          <button class="account-row"><span lang="ko">외화예금</span><span lang="en">Foreign currency</span>
            <span class="account-value"><span lang="ko">0개</span><span lang="en">0 accounts</span></span>
            <span class="chevron"><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m2.5 3.8 2.5 2.5 2.5-2.5" /></svg></span>
          </button>
          <button class="account-row"><span lang="ko">투자상품</span><span lang="en">Investments</span>
            <span class="account-value"><span lang="ko">확인하기</span><span lang="en">View</span></span>
            <span class="chevron"><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m2.5 3.8 2.5 2.5 2.5-2.5" /></svg></span>
          </button>
        </div>
        <div class="accounts-group">
          <button class="account-row"><span lang="ko">보험</span><span lang="en">Insurance</span>
            <span class="account-value"><span lang="ko">확인하기</span><span lang="en">View</span></span>
            <span class="chevron"><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m2.5 3.8 2.5 2.5 2.5-2.5" /></svg></span>
          </button>
          <button class="account-row"><span lang="ko">대출</span><span lang="en">Loans</span>
            <span class="account-value"><span lang="ko">0개</span><span lang="en">0 loans</span></span>
            <span class="chevron"><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m2.5 3.8 2.5 2.5 2.5-2.5" /></svg></span>
          </button>
          <button class="account-row"><span lang="ko">현대카드</span><span lang="en">Hyundai Card</span>
            <span class="account-value"><span lang="ko">0개</span><span lang="en">0 cards</span></span>
            <span class="chevron"><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m2.5 3.8 2.5 2.5 2.5-2.5" /></svg></span>
          </button>
        </div>
      </div>
    </section>

    <!-- Product shortcuts. -->
    <nav class="products">
      <button class="product">
        <img src="assets/product-deposit.png" width="54" height="54" alt="">
        <span class="product-label"><span lang="ko">입출금</span><span lang="en">Checking</span></span>
      </button>
      <button class="product">
        <img src="assets/product-savings.png" width="54" height="54" alt="">
        <span class="product-label"><span lang="ko">예적금</span><span lang="en">Savings</span></span>
      </button>
      <button class="product">
        <img src="assets/product-credit.png" width="54" height="54" alt="">
        <span class="product-label"><span lang="ko">신용카드</span><span lang="en">Credit card</span></span>
      </button>
      <button class="product">
        <img src="assets/product-check.png" width="54" height="54" alt="">
        <span class="product-label"><span lang="ko">체크카드</span><span lang="en">Debit card</span></span>
      </button>
      <button class="product">
        <img src="assets/product-loan.png" width="54" height="54" alt="">
        <span class="product-label"><span lang="ko">대출</span><span lang="en">Loans</span></span>
      </button>
    </nav>

    <!-- Feed: 12 cards in app order. Tones: is-cyan, is-yellow, is-event (white with a border).
         Characters are cropped at 3x, so each carries its size in points. The name is the placeholder 홍길동 (Hong Gildong). -->
    <section class="feed">
      <button class="feed-card is-cyan">
        <div class="feed-text">
          <p class="feed-eyebrow">2026.10.17</p>
          <p class="feed-title"><span lang="ko">홍길동님, 이번 달<br>자산관리 일정을 챙겨보세요</span><span lang="en">Hong Gildong, plan this<br>month's wealth schedule</span></p>
        </div>
        <img class="feed-art" src="assets/char-book.png" width="68" height="85" alt="">
      </button>

      <button class="feed-card is-event">
        <div class="feed-text">
          <p class="feed-eyebrow"><span lang="ko">이벤트</span><span lang="en">Event</span></p>

<!-- The only script: language switch, 편한뱅킹 switch, and the top bar shadow on scroll. -->
<script>
  function setLanguage(lang) {
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-set-lang]").forEach((button) => {
      button.setAttribute("aria-pressed", button.dataset.setLang === lang);
    });
  }
  document.querySelectorAll("[data-set-lang]").forEach((button) => {
    button.addEventListener("click", () => setLanguage(button.dataset.setLang));
  });
  setLanguage(new URLSearchParams(location.search).get("lang") === "en" ? "en" : "ko");

  document.querySelectorAll('[role="switch"]').forEach((toggle) => {
    toggle.addEventListener("click", () => {
      toggle.setAttribute("aria-checked", toggle.getAttribute("aria-checked") !== "true");
    });
  });

  const topBar = document.querySelector(".top");
  window.addEventListener("scroll", () => topBar.classList.toggle("is-scrolled", window.scrollY > 4), { passive: true });
</script>
